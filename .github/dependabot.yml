version: 2
updates:
  # Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "emaarco"
    # Group all dependency updates together
    groups:
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
