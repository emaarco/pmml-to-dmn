version: 2
updates:
  # npm: patch+minor in one weekly PR (auto-merges via CI gate); majors separate for manual review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-patch-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch", "minor"]
      npm-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # GitHub Actions: everything in one monthly PR (SHA-pinned, mostly mechanical).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      github-actions-all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch", "minor", "major"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
