name: 💡 Feature request
description: Suggest a new capability (e.g. support for a PMML feature)
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to achieve? What is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: pmml
    attributes:
      label: Example PMML (if applicable)
      render: xml
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
