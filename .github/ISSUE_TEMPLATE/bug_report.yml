name: 🐞 Bug report
description: Report something that is not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: pmml
    attributes:
      label: PMML input
      description: The (minimal) PMML that triggers the problem.
      render: xml
  - type: textarea
    id: output
    attributes:
      label: Actual output / error
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Git commit or release you are using.
  - type: dropdown
    id: surface
    attributes:
      label: Where did it occur?
      options:
        - CLI
        - Web app
        - Core library
    validations:
      required: true
